<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img"
     aria-label="Codman pendulum exercise — 어깨 진자운동">
  <title>Codman Pendulum — 어깨 진자운동</title>
  <desc>허리를 앞으로 굽히고 환측 팔을 늘어뜨려 시계/반시계 방향으로 원을 그리는 어깨 1단계 재활운동.</desc>

  <!-- 배경 -->
  <rect width="320" height="320" fill="#fafafa"/>

  <!-- 바닥선 -->
  <line x1="20" y1="290" x2="300" y2="290" stroke="#9ca3af" stroke-width="2"/>

  <!-- 테이블(지지대) -->
  <rect x="200" y="180" width="80" height="6" fill="#9ca3af"/>
  <rect x="205" y="186" width="4" height="100" fill="#9ca3af"/>
  <rect x="271" y="186" width="4" height="100" fill="#9ca3af"/>

  <!-- 머리 -->
  <circle cx="80" cy="100" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- 몸통 (허리 굽힘 자세 — 머리에서 골반까지 사선) -->
  <line x1="80" y1="118" x2="170" y2="180" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- 지지 팔 (테이블에 짚음) -->
  <line x1="160" y1="170" x2="220" y2="186" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- 늘어뜨린 환측 팔 -->
  <line x1="90" y1="150" x2="95" y2="225" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- 손 -->
  <circle cx="95" cy="230" r="6" fill="#2563eb"/>

  <!-- 다리 (두 다리 살짝 벌림) -->
  <line x1="170" y1="180" x2="155" y2="285" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="180" x2="185" y2="285" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- 진자 움직임 궤적 (원) -->
  <ellipse cx="95" cy="240" rx="35" ry="12" fill="none" stroke="#2563eb"
           stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>

  <!-- 화살표 (방향) -->
  <path d="M 130 240 Q 130 230 120 226" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="120,226 125,222 122,229" fill="#2563eb"/>

  <!-- 라벨 -->
  <text x="160" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    Codman Pendulum
  </text>
  <text x="160" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">
    어깨 진자운동 · 1단계(급성기)
  </text>

  <!-- 동작 메모 -->
  <text x="160" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">
    환측 팔(파란색)을 늘어뜨려 원을 그림 · 10회 × 3세트
  </text>
</svg>
