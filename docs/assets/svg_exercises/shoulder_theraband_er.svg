<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img"
     aria-label="Theraband External Rotation — 세라밴드 외회전">
  <title>Theraband External Rotation — 세라밴드 외회전</title>
  <desc>팔꿈치 90도 굽힘, 옆구리 고정, 밴드를 외측으로 당기는 회전근개(극하근/소원근) 강화 운동.</desc>

  <rect width="320" height="320" fill="#fafafa"/>
  <line x1="20" y1="290" x2="300" y2="290" stroke="#9ca3af" stroke-width="2"/>

  <!-- 문기둥 (밴드 고정점) -->
  <rect x="40" y="80" width="6" height="210" fill="#9ca3af"/>
  <circle cx="43" cy="160" r="4" fill="#1f2937"/>

  <!-- 사람: 측면 자세 -->
  <!-- 머리 -->
  <circle cx="180" cy="100" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- 몸통 (직립) -->
  <line x1="180" y1="118" x2="180" y2="230" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <!-- 다리 -->
  <line x1="180" y1="230" x2="165" y2="290" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="230" x2="195" y2="290" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- 옆구리 고정한 위팔 (어깨에서 팔꿈치로 수직 아래) -->
  <line x1="180" y1="150" x2="180" y2="190" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- 팔꿈치 표시 -->
  <circle cx="180" cy="190" r="4" fill="#2563eb"/>
  <!-- 아래팔: 팔꿈치 90도, 외측으로 향함 -->
  <line x1="180" y1="190" x2="130" y2="190" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- 손 (밴드 손잡이) -->
  <circle cx="130" cy="190" r="6" fill="#2563eb"/>

  <!-- 세라밴드 (탄성 표현 — 약간 늘어진 곡선) -->
  <path d="M 46 160 Q 90 175 130 190" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="2 3"/>

  <!-- 옆구리 수건 표시(고정용) -->
  <rect x="172" y="170" width="16" height="14" fill="#fbbf24" stroke="#1f2937" stroke-width="1"/>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#1f2937">수건</text>

  <!-- 운동 방향 화살표 (외측으로 당김) -->
  <path d="M 130 210 Q 125 215 100 215" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="100,215 108,210 108,220" fill="#dc2626"/>

  <!-- 라벨 -->
  <text x="160" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    Theraband External Rotation
  </text>
  <text x="160" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">
    세라밴드 외회전 · 4단계(회전근개 강화)
  </text>

  <text x="160" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">
    팔꿈치 90° + 옆구리 고정 · 밴드 외측으로 당김 · 15회 × 3세트
  </text>
</svg>
