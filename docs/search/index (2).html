<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ortho-kb · 위키 검색 (챗봇)</title>
<style>
  :root {
    --bg: #fafafa; --fg: #222; --muted: #666; --accent: #1d4ed8;
    --bubble-user: #dbeafe; --bubble-bot: #fff; --border: #e5e7eb;
    --warn-bg: #fff7e6; --warn-border: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 0.75rem 1rem; background: #fff; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1rem; margin: 0; }
  header a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  .disclaimer {
    background: var(--warn-bg); border-left: 4px solid var(--warn-border);
    padding: 0.6rem 1rem; font-size: 0.85rem;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 1rem; max-width: 820px;
    width: 100%; margin: 0 auto;
  }
  .msg { margin: 0.6rem 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%; padding: 0.7rem 0.95rem; border-radius: 14px;
    line-height: 1.55; word-break: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); }
  .msg.bot .bubble {
    background: var(--bubble-bot); border: 1px solid var(--border);
  }
  .bot .heading { font-weight: 600; margin-bottom: 0.25rem; color: var(--accent); }
  .bot .body { font-size: 0.93rem; white-space: pre-wrap; }
  .bot .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }
  .bot .meta a { color: var(--accent); margin-left: 0.4rem; }
  .bot .footer-note {
    font-size: 0.8rem; color: var(--warn-border); margin-top: 0.5rem;
    border-top: 1px dashed var(--warn-border); padding-top: 0.4rem;
  }
  form#chatform {
    display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--border);
    background: #fff; max-width: 820px; width: 100%; margin: 0 auto;
  }
  #q {
    flex: 1; padding: 0.75rem; border: 1px solid var(--border); border-radius: 10px;
    font-size: 1rem; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  button {
    padding: 0 1.2rem; background: var(--accent); color: white; border: 0;
    border-radius: 10px; font-size: 1rem; cursor: pointer;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .empty-hint { color: var(--muted); padding: 2rem; text-align: center; font-size: 0.95rem; }
  .quick-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
  .quick-chip {
    padding: 0.4rem 0.7rem; background: #f3f4f6; border: 1px solid var(--border);
    border-radius: 999px; font-size: 0.85rem; cursor: pointer; color: var(--fg);
  }
  .quick-chip:hover { background: var(--bubble-user); border-color: var(--accent); }
  mark { background: #fef08a; padding: 0 0.1em; border-radius: 2px; font-weight: 500; }
  .part-tag {
    background: var(--accent); color: white; padding: 0.1em 0.5em;
    border-radius: 4px; font-size: 0.78rem; margin-right: 0.3rem;
  }
  .result-item {
    margin: 0.6rem 0; padding: 0.5rem 0; border-bottom: 1px dashed #eee;
  }
  .result-title { font-weight: 600; margin-bottom: 0.3rem; }
  .result-title a { text-decoration: none; color: var(--accent); }
  .result-title a:hover { text-decoration: underline; }

  /* Sprint 6 — 의도 카드 시스템 */
  .card {
    margin: 0.7rem 0; padding: 0.7rem 0.9rem;
    border-radius: 8px; border-left: 4px solid #9ca3af;
    background: #fff;
  }
  .card-head { font-weight: 700; margin-bottom: 0.4rem; }
  .card-body { font-size: 0.9rem; line-height: 1.55; }
  .card-foot { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }
  .card-red { background: #fef2f2; border-left-color: #dc2626; }
  .card-red .card-head { color: #991b1b; font-size: 1rem; }
  .card-red-light { background: #fff7ed; border-left-color: #fb923c; }
  .card-yellow { background: #fefce8; border-left-color: #eab308; }
  .card-blue { background: #eff6ff; border-left-color: var(--accent); }
  .card-green { background: #f0fdf4; border-left-color: #059669; }
  .card-purple { background: #faf5ff; border-left-color: #9333ea; }
  .card-gray { background: #f9fafb; border-left-color: #9ca3af; }
  .intent-tag {
    background: #f3f4f6; color: #374151; padding: 0.1em 0.5em;
    border-radius: 4px; font-size: 0.78rem; margin-right: 0.2rem;
  }
  .norm-info {
    background: #f3f4f6; padding: 0.4rem 0.7rem;
    border-radius: 6px; margin: 0.4rem 0;
    font-size: 0.82rem; color: var(--muted);
    display: flex; gap: 1rem; flex-wrap: wrap;
  }
  .norm-info b { color: var(--accent); }
  .interaction-table {
    width: 100%; border-collapse: collapse; font-size: 0.85rem;
    margin-top: 0.3rem;
  }
  .interaction-table th, .interaction-table td {
    border: 1px solid #e5e7eb; padding: 0.35rem 0.5rem; text-align: left;
    vertical-align: top;
  }
  .interaction-table th { background: #f9fafb; }
</style>
</head>
<body>

<header>
  <h1>ortho-kb 위키 검색</h1>
  <a href="../index.html">← 위키 홈</a>
</header>

<div class="disclaimer">
  ⚠️ 본 검색은 위키 본문에서만 답합니다. 진단·처방은 하지 않습니다. 증상이 있으면 전문의 진료를 받으세요.
</div>

<main id="chat">
  <div class="empty-hint">
    <div style="margin-bottom: 0.8rem;">예시 질문 (탭해서 빠른 검색):</div>
    <div class="quick-chips">
      <button class="quick-chip" data-q="어깨 야간통">어깨 야간통</button>
      <button class="quick-chip" data-q="회전근개 파열 수술">회전근개 파열 수술</button>
      <button class="quick-chip" data-q="무릎 계단 통증">무릎 계단 통증</button>
      <button class="quick-chip" data-q="동결견 오십견">동결견·오십견</button>
      <button class="quick-chip" data-q="허리 디스크 다리 저림">허리 디스크 다리 저림</button>
      <button class="quick-chip" data-q="마미증후군">마미증후군 (응급)</button>
      <button class="quick-chip" data-q="발목 삠 응급실">발목 삠 응급실</button>
      <button class="quick-chip" data-q="족저근막염 스트레칭">족저근막염 스트레칭</button>
      <button class="quick-chip" data-q="손목 야간 저림">손목 야간 저림</button>
      <button class="quick-chip" data-q="이부프로펜 와파린">이부프로펜+와파린</button>
    </div>
  </div>
</main>

<form id="chatform" autocomplete="off">
  <input id="q" list="suggestions" placeholder="어디가 어떻게 아픈지 자연어로 입력하세요..." aria-label="질문 입력" />
  <datalist id="suggestions">
    <option value="어깨 야간통이 4주 넘게 지속돼요">
    <option value="어깨를 들어올릴 때 60~120도에서 아파요">
    <option value="회전근개 파열은 무조건 수술해야 하나요">
    <option value="동결견과 회전근개 파열 차이">
    <option value="무릎이 계단 내려갈 때 아파요">
    <option value="무릎이 잠겨서 펴지지 않아요">
    <option value="무릎 OA에 히알루론산 효과 있나요">
    <option value="발목 삐었는데 X-ray 찍어야 하나요">
    <option value="발목 자주 삐어요 만성 불안정성인가요">
    <option value="아킬레스건 파열 수술 vs 보존">
    <option value="아침에 첫걸음 발뒤꿈치 통증">
    <option value="족저근막염 체외충격파">
    <option value="모턴 신경종 신발">
    <option value="손목이 시큰거리고 야간에 손이 저려요">
    <option value="수근관 증후군 부목">
    <option value="드퀘르벵 건초염 엄지 통증">
    <option value="허리 통증이 6주 넘게">
    <option value="추간판 탈출 좌골신경통">
    <option value="허리 통증과 대소변 장애">
    <option value="이부프로펜이랑 와파린 같이 먹어도 돼">
    <option value="NSAID 위장약 PPI 병용">
    <option value="듀록세틴 무릎 OA">
  </datalist>
  <button type="submit" id="send">검색</button>
</form>

<script>
// ─── 위키 인덱스 + 의도 데이터 동시 로딩 ─────────────────────────
let INDEX = null;
let INTENTS = null;
let LOADING = Promise.all([
  fetch('index.json').then(r => r.json()),
  fetch('intents.json').then(r => r.json()).catch(() => null),
]).then(([idx, intents]) => { INDEX = idx; INTENTS = intents; });

// ─── 쿼리 정규화 (오타 교정 + 동의어 → canonical + Sprint 7 확장) ─────────────
function normalizeQuery(rawQuery) {
  if (!INTENTS) return {
    normalized: rawQuery, expansions: [], typos: [],
    negated: [], compoundParts: null, patientPhrases: [], loanwords: []
  };
  let q = rawQuery;
  const typos = [];
  // 1) 오타 교정
  const typoMap = INTENTS.common_typos || {};
  for (const [wrong, right] of Object.entries(typoMap)) {
    if (wrong.startsWith("_")) continue;
    if (q.includes(wrong) && wrong !== right) {
      q = q.replaceAll(wrong, right);
      typos.push({ from: wrong, to: right });
    }
  }
  // 2) 동의어 → canonical
  const expansions = new Set();
  const bs = INTENTS.body_synonyms || {};
  for (const [slug, syns] of Object.entries(bs)) {
    for (const [canonical, vars_] of Object.entries(syns)) {
      if (canonical.startsWith("_")) continue;
      for (const v of vars_) {
        if (q.includes(v)) expansions.add(canonical);
      }
      if (q.includes(canonical)) {
        for (const v of vars_) expansions.add(v);
      }
    }
  }
  // 글로벌 동의어
  const gs = INTENTS.global_synonyms || {};
  for (const [canonical, vars_] of Object.entries(gs)) {
    if (canonical.startsWith("_")) continue;
    for (const v of vars_) if (q.includes(v)) expansions.add(canonical);
    if (q.includes(canonical)) for (const v of vars_) expansions.add(v);
  }

  // 3) Sprint 7 — 환자 표현 매칭 → 의학 용어로 확장
  const patientPhrases = [];
  const pp = INTENTS.patient_phrases || {};
  for (const [phrase, medTerms] of Object.entries(pp)) {
    if (phrase.startsWith("_")) continue;
    if (q.includes(phrase)) {
      patientPhrases.push({ phrase, medTerms });
      for (const t of medTerms) expansions.add(t);
    }
  }

  // 4) Sprint 7 — 외래어 매칭
  const loanwords = [];
  const lw = INTENTS.loanword_dictionary || {};
  for (const [loan, terms] of Object.entries(lw)) {
    if (loan.startsWith("_")) continue;
    if (q.includes(loan)) {
      loanwords.push({ loan, terms });
      for (const t of terms) expansions.add(t);
    }
  }

  // 5) Sprint 7 — 부정 표현 감지 (단순 substring 매칭)
  const negated = [];
  const negCfg = INTENTS.negation_patterns || {};
  const negMap = negCfg.negate_categories || {};
  for (const [phrase, category] of Object.entries(negMap)) {
    if (phrase.startsWith("_")) continue;
    if (q.includes(phrase)) {
      negated.push({ phrase, category });
    }
  }

  // 6) Sprint 7 — 복수 부위 감지 (require_all 또는 match_any)
  let compoundParts = null;
  const cb = INTENTS.compound_body_patterns || {};
  for (const [key, cfg] of Object.entries(cb)) {
    if (key.startsWith("_")) continue;
    let matched = false;
    if (cfg.require_all && Array.isArray(cfg.require_all)) {
      matched = cfg.require_all.every(kw => q.includes(kw));
    } else if (cfg.match_any) {
      for (const pat of cfg.match_any) {
        try {
          if (new RegExp(pat).test(q)) { matched = true; break; }
        } catch (e) {
          if (q.includes(pat)) { matched = true; break; }
        }
      }
    }
    if (matched) {
      compoundParts = { key, primary: cfg.primary, note: cfg.note };
      break;
    }
  }

  // 7) Sprint 8 W5 — 시간 표현 감지 (급성/아급성/만성/외상)
  //    우선순위: trauma > acute > subacute > chronic (외상이 시간보다 우선)
  let timeStage = null;
  const te = INTENTS.time_expressions || {};
  for (const stage of ['trauma', 'acute', 'subacute', 'chronic']) {
    const cfg = te[stage];
    if (!cfg || !cfg.patterns) continue;
    for (const p of cfg.patterns) {
      if (q.includes(p)) { timeStage = { stage, hit: p, desc: cfg._desc || stage }; break; }
    }
    if (timeStage) break;
  }

  return { normalized: q, expansions: [...expansions], typos,
           negated, compoundParts, patientPhrases, loanwords, timeStage };
}

// ─── Red Flag 감지 ─────────────────────────────────────────────
function detectRedFlag(query) {
  if (!INTENTS) return null;
  const triggers = INTENTS.red_flag_triggers || {};
  for (const [key, t] of Object.entries(triggers)) {
    if (key.startsWith("_")) continue;
    // 1) match_any (단일 OR)
    const hits = (t.match_any || []).filter(k => query.includes(k));
    if (hits.length > 0) {
      return { ...t, key, hits };
    }
    // 2) match_all_groups (다중 그룹 AND of OR)
    const groups = t.match_all_groups || [];
    if (groups.length > 0) {
      const groupHits = [];
      let allOk = true;
      for (const group of groups) {
        const hit = group.find(k => query.includes(k));
        if (!hit) { allOk = false; break; }
        groupHits.push(hit);
      }
      if (allOk && groupHits.length > 0) {
        return { ...t, key, hits: groupHits };
      }
    }
  }
  return null;
}

// ─── 의도 분류 ─────────────────────────────────────────────────
function classifyIntent(query) {
  if (!INTENTS) return [];
  const ic = INTENTS.intent_classifier || {};
  const intents = [];
  for (const [intent, kws] of Object.entries(ic)) {
    if (intent.startsWith("_")) continue;
    if (kws.some(k => query.includes(k))) intents.push(intent);
  }
  return intents;
}

// ─── 약물 상호작용 감지 ────────────────────────────────────────
function detectDrugInteraction(query) {
  if (!INTENTS) return null;
  const di = INTENTS.drug_interaction_triggers || {};
  const drugs = di.drugs || [];
  const present = drugs.filter(d => query.includes(d));
  if (present.length < 2) return null;
  const found = [];
  for (const inter of (di.interactions || [])) {
    const a_hit = present.some(d => d.includes(inter.a) || inter.a.includes(d) || inter.a === "NSAID" && ["이부프로펜","나프록센","셀레콕시브","아스피린"].includes(d));
    const b_hit = present.some(d => d.includes(inter.b) || inter.b.includes(d));
    if (a_hit && b_hit) found.push(inter);
  }
  if (found.length === 0) return { drugs: present, interactions: [] };
  return { drugs: present, interactions: found };
}

// ─── Sprint 8 W7: 약물 비교 감지 ─────────────────────────────────
//   사용자 질문에 비교 의도("vs", "비교", "차이", "어떤 게") 또는
//   비교쌍의 두 약물이 동시에 등장하면 비교 카드 노출
function detectDrugComparison(query) {
  if (!INTENTS) return null;
  const dc = INTENTS.drug_comparison || {};
  const pairs = dc.comparable_pairs || dc.pairs || [];
  if (!pairs.length) return null;
  const lowerQ = query.toLowerCase();
  for (const pair of pairs) {
    const drugs = pair.drugs || [];
    const aliases = pair.aliases || [];
    if (drugs.length < 2 || aliases.length < 2) continue;
    // 각 약물군 = canonical 이름 + aliases 그룹 (둘 다 포함)
    const groups = drugs.map((d, idx) => {
      const aliasGroup = aliases[idx] || [];
      return [d, ...aliasGroup];
    });
    const hits = groups.map(group => {
      return group.find(name => lowerQ.includes(name.toLowerCase()));
    });
    if (hits.every(h => h)) {
      return { pair, hits, intent: 'explicit' };
    }
  }
  return null;
}

// ─── Sprint 8 W8: 운동 금기 감지 ─────────────────────────────────
//   사용자가 "디스크 환자 스쿼트 해도 돼?" 같은 질문 시
//   질환 키워드 + 운동 의도 동시 매칭하면 금기 카드 노출
function detectExerciseContraindication(query, intents) {
  if (!INTENTS) return null;
  const ec = INTENTS.exercise_contraindications || {};
  const rules = ec.rules || [];
  if (!rules.length) return null;
  // 운동 의도 또는 운동 키워드 확인
  const hasExerciseIntent = (intents && intents.includes('exercise')) ||
    /운동|스트레칭|체조|해도\s*돼|해도\s*되|할\s*수\s*있|괜찮|금기|스쿼트|점프|런지|데드리프트|벤치프레스|푸쉬업|플랭크|오버헤드|윗몸일으키기|달리기|줄넘기|등산|자전거/i.test(query);
  if (!hasExerciseIntent) return null;
  // 질환 키워드 매칭
  const matched = [];
  for (const rule of rules) {
    const keys = rule.condition_keywords || rule.aliases || [];
    for (const kw of keys) {
      if (query.includes(kw)) {
        matched.push({ rule, hit: kw });
        break;
      }
    }
  }
  return matched.length ? matched : null;
}

// ─── Sprint 14 Step 3: 운동 일반 카탈로그 감지 ─────────────────────
function detectExerciseCatalog(query) {
  if (!INTENTS) return null;
  const ec = INTENTS.exercise_catalog || {};
  const exercises = ec.exercises || [];
  const principles = ec.general_principles || [];
  const lowerQ = query.toLowerCase();
  const matchedEx = [];
  for (const ex of exercises) {
    const names = [ex.name.toLowerCase(), ...(ex.aliases || []).map(a => a.toLowerCase())];
    if (names.some(n => lowerQ.includes(n))) {
      matchedEx.push(ex);
    }
  }
  const matchedPrinciples = [];
  for (const p of principles) {
    if (query.includes(p.title)) matchedPrinciples.push(p);
  }
  if (matchedEx.length === 0 && matchedPrinciples.length === 0) return null;
  return { exercises: matchedEx, principles: matchedPrinciples };
}

// ─── Sprint 14 운동 카탈로그 감지 ──────────────────────────────────
function detectExerciseCatalog(query) {
  if (!INTENTS) return null;
  const ec = INTENTS.exercise_catalog || {};
  const movements = ec.movements || [];
  const principles = ec.general_principles || [];
  const matchedMovements = [];
  for (const m of movements) {
    for (const alias of (m.aliases || [])) {
      if (query.includes(alias)) {
        matchedMovements.push(m);
        break;
      }
    }
  }
  const matchedPrinciples = [];
  for (const p of principles) {
    for (const kw of (p.matches || [])) {
      if (query.includes(kw)) {
        matchedPrinciples.push(p);
        break;
      }
    }
  }
  if (!matchedMovements.length && !matchedPrinciples.length) return null;
  return { movements: matchedMovements, principles: matchedPrinciples };
}

// ─── Sprint 13 W4: 인구학 맥락 감지 ────────────────────────────────
// 안전: 진단 단정 절대 금지. 위험인자 정보 카드만 노출.
function detectDemographicContext(query) {
  if (!INTENTS) return null;
  const dc = INTENTS.demographic_context || {};
  const patterns = dc.patterns || [];
  if (!patterns.length) return null;
  const matched = [];
  for (const p of patterns) {
    if (p.match_all && !p.match_all.every(k => query.includes(k))) continue;
    if (p.match_any && !p.match_any.some(k => query.includes(k))) continue;
    if (p.match_any_age && !p.match_any_age.some(k => query.includes(k))) continue;
    if (p.match_any_part && !p.match_any_part.some(k => query.includes(k))) continue;
    matched.push({
      id: p.id,
      title: p.title,
      note: p.note,
      related_slug: p.related_slug
    });
  }
  return matched.length ? matched : null;
}

// 한국어 조사 (긴 것부터 매칭)
const KOREAN_PARTICLES = [
  '에서는','에서도','에서','으로','에게서','에게','에는','에도','에',
  '와는','과는','와','과','랑','이랑','처럼','같이','보다','마저',
  '께서는','께서','이가','가','이','을','를',
  '은','는','도','만','조차','마다','뿐','라도','이라도',
  '의',
  '이다','입니다','이며','이고','이고요','이에요','예요',
  '있어요','있어','있다','없어','없다','있는','없는',
  '한다','합니다','해요','한','할','함',
  '다','요','지','네','야','어','아','냐',
  '었다','었던','였다','였던','겠다','겠습니다',
].sort((a, b) => b.length - a.length);

function stripParticle(word) {
  for (const p of KOREAN_PARTICLES) {
    if (word.endsWith(p) && word.length - p.length >= 2) {
      return word.slice(0, word.length - p.length);
    }
  }
  return word;
}

function tokenize(text) {
  const tokens = new Set();
  const kor = text.match(/[가-힣]+/g) || [];
  const eng = (text.toLowerCase().match(/[a-z]{2,}/g) || []);
  for (const w of kor) {
    if (w.length >= 2) tokens.add(w);              // 원형
    const stem = stripParticle(w);
    if (stem.length >= 2 && stem !== w) tokens.add(stem);  // 어간
  }
  eng.forEach(t => tokens.add(t));
  return Array.from(tokens);
}

function detectBodyPart(queryTokens, queryRaw) {
  const lowerRaw = (queryRaw || '').toLowerCase();
  // Sprint 13: 가장 긴 매칭 키워드 우선 (예: '엄지 CMC' > '관절염')
  // 1차: raw 문자열 substring 중 longest 채택
  let best = null;  // [length, slug]
  for (const [slug, keywords] of Object.entries(BODY_PARTS)) {
    for (const kw of keywords) {
      const kwLower = kw.toLowerCase();
      if (lowerRaw.includes(kwLower)) {
        if (best === null || kw.length > best[0]) best = [kw.length, slug];
      }
    }
  }
  if (best) return best[1];
  // 2차: 토큰 정확 일치 중 longest
  best = null;
  for (const [slug, keywords] of Object.entries(BODY_PARTS)) {
    for (const kw of keywords) {
      const kwLower = kw.toLowerCase();
      for (const qt of queryTokens) {
        if (qt.toLowerCase() === kwLower) {
          if (best === null || kw.length > best[0]) best = [kw.length, slug];
          break;
        }
      }
    }
  }
  return best ? best[1] : null;
}

function isDrugQuery(queryTokens, queryRaw) {
  const rawLow = (queryRaw || '').toLowerCase();
  for (const kw of DRUG_KEYWORDS) {
    if (rawLow.includes(kw.toLowerCase())) return true;
  }
  for (const qt of queryTokens) {
    for (const kw of DRUG_KEYWORDS) {
      if (qt.toLowerCase() === kw.toLowerCase()) return true;
    }
  }
  return false;
}

function score(chunk, queryTokens, detectedBodySlug, negatedCategories, timeStage, drugQuery, redFlagActive) {
  if (!queryTokens.length) return 0;
  const headingTokens = new Set(tokenize(chunk.heading));
  const bodySet = new Set(chunk.tokens);
  const text = chunk.text || '';
  const heading = chunk.heading || '';
  // (A) 부위 일치 부스트 — 가장 강함
  const partMatch = detectedBodySlug && chunk.slug === detectedBodySlug;
  const partBoost = partMatch ? 10 : 0;
  if (detectedBodySlug && chunk.slug !== detectedBodySlug) {
    return 0;
  }
  // (D) Sprint 7 — 부정된 카테고리 페널티
  //   사용자가 "수술 말고"라고 하면 chunk.cat이 surgery인 결과는 감점
  //   단, emergency 카테고리는 안전상 절대 페널티 안 줌
  if (negatedCategories && negatedCategories.length > 0) {
    const chunkCat = categorize(chunk);
    if (chunkCat !== 'emergency' && negatedCategories.includes(chunkCat)) {
      // 큰 페널티지만 완전 제거는 안 함 (사용자 질문 일부가 매칭될 수도)
      return Math.max(0, _calcRawScore(chunk, queryTokens) - 15);
    }
  }
  // (B) 운동 질문 부스트 + Sprint 8 W5 시간 단계 부스트
  const EXERCISE_HINTS = ['운동', '스트레칭', '데드버그', '버드독', '슬라이드',
    '직거상', 'set', 'tilt', 'curl', 'glide', 'squat', 'bridge', 'pendulum',
    'theraband', 'alphabet'];
  let exerciseQuery = false;
  for (const qt of queryTokens) {
    for (const h of EXERCISE_HINTS) {
      if (qt === h || qt.includes(h) || h.includes(qt)) { exerciseQuery = true; break; }
    }
    if (exerciseQuery) break;
  }
  let stageBoost = exerciseQuery && /단계/.test(heading) ? 4 : 0;
  // W5 시간 표현 → 해당 단계 섹션 추가 부스트
  // acute → 1단계 / subacute → 2단계 / chronic → 3·4단계
  if (timeStage) {
    if (timeStage.stage === 'acute' && /1단계|급성기/.test(heading)) stageBoost += 6;
    else if (timeStage.stage === 'subacute' && /2단계|아급성|ROM/i.test(heading)) stageBoost += 6;
    else if (timeStage.stage === 'chronic' && /(3단계|4단계|만성|근력|코어\s*강화|복귀)/i.test(heading)) stageBoost += 6;
    else if (timeStage.stage === 'trauma' && /(외상|즉시|Red\s*Flag|응급)/i.test(heading)) stageBoost += 8;
  }
  const SYMPTOM_HINTS = ['통증', '아파', '아프', '저림', '저린', '뻐근', '시큰',
    '잠김', '잠겨', '붓고', '부어', '부종', '거슬리', '욱신', '찌릿', '쑤시',
    '약해져', '약화', '들어올', '굽힐', '펼때', '들때', '끊어', '삐어', '삐었'];
  let symptomQuery = false;
  for (const qt of queryTokens) {
    for (const h of SYMPTOM_HINTS) {
      if (qt === h || qt.includes(h) || h.includes(qt)) { symptomQuery = true; break; }
    }
    if (symptomQuery) break;
  }
  const diagSection = /^(1\.|1\s|2\.|2\s|흔한|감별|증상|Red\s*Flag|자가)/i.test(heading);
  const symptomBoost = symptomQuery && diagSection ? 6 : 0;
  // Sprint 12 약물 부스트 — 약물 쿼리이면 약물 카테고리 청크에 +6
  const drugBoost = (drugQuery && categorize(chunk) === 'medication') ? 6 : 0;
  // Sprint 13 Red Flag 부스트 — 응급 트리거 발동 시 emergency 청크에 +8
  const redFlagBoost = (redFlagActive && categorize(chunk) === 'emergency') ? 8 : 0;
  let s = partBoost + stageBoost + symptomBoost + drugBoost + redFlagBoost;
  for (const qt of queryTokens) {
    if (headingTokens.has(qt)) s += 8;
    const escaped = qt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escaped, 'gi');
    const matches = text.match(re);
    const tf = matches ? matches.length : 0;
    if (tf > 0) s += 1 + Math.log(1 + tf) * 1.5;
    for (const ht of headingTokens) if (ht.includes(qt) && ht !== qt) s += 3;
    for (const bt of bodySet) if (bt.includes(qt) && bt !== qt) s += 0.3;
  }
  return s;
}

// 부정 페널티 계산용 — 부정 무시한 원 점수
function _calcRawScore(chunk, queryTokens) {
  const headingTokens = new Set(tokenize(chunk.heading));
  const bodySet = new Set(chunk.tokens);
  const text = chunk.text || '';
  let s = 0;
  for (const qt of queryTokens) {
    if (headingTokens.has(qt)) s += 8;
    const escaped = qt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escaped, 'gi');
    const matches = text.match(re);
    const tf = matches ? matches.length : 0;
    if (tf > 0) s += 1 + Math.log(1 + tf) * 1.5;
    for (const ht of headingTokens) if (ht.includes(qt) && ht !== qt) s += 3;
    for (const bt of bodySet) if (bt.includes(qt) && bt !== qt) s += 0.3;
  }
  return s;
}

  '파열 의심','아킬레스 파열','수동 신전'
];

function detectEmergency(queryTokens, queryRaw) {
  const lowerRaw = (queryRaw || '').toLowerCase();
  for (const kw of EMERGENCY_KEYWORDS) {
    if (lowerRaw.includes(kw.toLowerCase())) return true;
    for (const qt of queryTokens) {
      if (qt.toLowerCase().includes(kw.toLowerCase())) return true;
    }
  }
  return false;
}

// ─── 청크 카테고리 자동 분류 (헤더 기반) ───
function categorize(chunk) {
  const h = chunk.heading || '';
  // 응급 우선
  if (/마미|Red\s*Flag|Kanavel|응급|즉시\s*의뢰|위급/i.test(h)) return 'emergency';
  if (/^1\.|흔한\s*증상|감별진단|진단/i.test(h)) return 'diagnosis';
  if (/^2\.|자가\s*체크/i.test(h)) return 'selfcheck';
  if (/^3\./i.test(h)) return 'examination';
  if (/약물|상호작용|일반의약품|처방약|주사|OTC/i.test(h)) return 'medication';
  if (/물리치료|모달리티|체외충격파|TENS|도수치료/i.test(h)) return 'physiotherapy';
  if (/운동|스트레칭|단계|재활|복귀/i.test(h)) return 'exercise';
  if (/수술|봉합|재건|치환|절제술|관절경/i.test(h)) return 'surgery';
  if (/출처|참고|References/i.test(h)) return 'reference';
  return 'general';
}

// ─── 검색 함수 v2 — 다양화 + 응급 우선 + 부정 카테고리 처리 ───
// 반환: [{chunk, s, cat}, ...] 배열
// preferRawForBody: 부위 감지 시 raw 쿼리 우선 (환자표현 확장으로 인한 오인식 방지)
function search(query, topK = 6, negatedCategories = [], timeStage = null, preferRawForBody = null, redFlagActive = false) {
  if (!INDEX) return [];
  const qTokens = tokenize(query);
  if (!qTokens.length) return [];
  // 부위 감지: raw 우선 → 없으면 enriched 폴백
  let detectedSlug = null;
  if (preferRawForBody) {
    const rawTokens = tokenize(preferRawForBody);
    detectedSlug = detectBodyPart(rawTokens, preferRawForBody);
  }
  if (!detectedSlug) {
    detectedSlug = detectBodyPart(qTokens, query);
  }
  const isEmergency = detectEmergency(qTokens, query);
  // Sprint 12 — 약물 쿼리 감지 (raw 우선 → enriched 폴백)
  const drugQuery = isDrugQuery(qTokens, preferRawForBody || query);

  let scored = INDEX.chunks
    .map(c => ({
      chunk: c,
      s: score(c, qTokens, detectedSlug, negatedCategories, timeStage, drugQuery, redFlagActive),
      cat: categorize(c)
    }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s);

  if (!scored.length) return [];

  const selected = [];
  const catCount = {};
  if (isEmergency) {
    const emergCandidates = scored.filter(x => x.cat === 'emergency').slice(0, 2);
    selected.push(...emergCandidates);
    emergCandidates.forEach(x => x._used = true);
  }
  for (const item of scored) {
    if (item._used) continue;
    if (selected.length >= topK) break;
    const cat = item.cat;
    if ((catCount[cat] || 0) >= 2) continue;
    selected.push(item);
    catCount[cat] = (catCount[cat] || 0) + 1;
  }
  return selected.slice(0, topK);
}

    { key: 'drug', label: '💊 약물·주사', cls: 'card-green' },
    { key: 'exercise', label: '🏃 재활운동·스트레칭', cls: 'card-purple' },
    { key: 'surgery', label: '🔪 수술 적응증', cls: 'card-gray' },
  ];

  if (!results.length) {
    html += `<div class="card card-gray"><div class="card-body">"${escapeHTML(query)}"에 대한 결과를 찾지 못했습니다.</div></div>`;
  } else {
    for (const spec of cardSpec) {
      const items = byIntent[spec.key] || [];
      if (!items.length) continue;
      html += `<div class="card ${spec.cls}">
        <div class="card-head">${spec.label} (${items.length})</div>
        <div class="card-body">`;
      for (const { chunk, s } of items.slice(0, 3)) {
        const url = '../' + chunk.url;
        const headingH = highlight(chunk.title + ' · ' + chunk.heading, qTokens);
        const textH = highlight(truncate(chunk.text, 240), qTokens);
        html += `
          <div class="result-item">
            <div class="result-title"><a href="${url}" target="_blank" rel="noopener">${headingH}</a></div>
            <div class="body">${textH}</div>
            <div class="meta">관련도 ${s.toFixed(1)}</div>
          </div>`;
      }
      html += `</div></div>`;
    }
    // 기타 카드
    const etc = byIntent.etc || [];
    if (etc.length) {
      html += `<div class="card card-gray">
        <div class="card-head">📌 기타 관련 (${etc.length})</div>
        <div class="card-body">`;
      for (const { chunk, s } of etc.slice(0, 2)) {
        const url = '../' + chunk.url;
        const headingH = highlight(chunk.title + ' · ' + chunk.heading, qTokens);
        html += `<div class="result-item">
          <div class="result-title"><a href="${url}" target="_blank" rel="noopener">${headingH}</a></div>
          <div class="meta">관련도 ${s.toFixed(1)}</div>
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  html += `
    <div class="footer-note">
      ⚠️ 본 답변은 위키 본문 발췌입니다. 본 위키는 진단·처방을 제공하지 않습니다.
      증상이 지속·악화되면 정형외과 전문의 진료를 받으세요.
    </div>
  </div>`;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function slugToFilename(slug) {
  return ({shoulder:'01_shoulder', knee:'02_knee', ankle:'03_ankle',
           foot:'04_foot', wrist:'05_wrist', lowback:'06_lowback'})[slug] || slug;
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// ─── 검색어 매칭 부분 하이라이트 ───
function highlight(text, queryTokens) {
  let escaped = escapeHTML(text);
  // 길이 긴 토큰부터 적용 (부분 일치 우선순위)
  const sorted = [...queryTokens].sort((a, b) => b.length - a.length);
  for (const tok of sorted) {
    if (tok.length < 2) continue;
    const re = new RegExp(`(${tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    escaped = escaped.replace(re, '<mark>$1</mark>');
  }
  return escaped;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  await handleSearch(qInput.value.trim());
});

// chip 클릭 시 빠른 검색
document.querySelectorAll('.quick-chip').forEach(btn => {
  btn.addEventListener('click', async () => {
    const q = btn.dataset.q;
    qInput.value = q;
    await handleSearch(q);
  });
});

async function handleSearch(q) {
  if (!q) return;
  qInput.value = '';
  sendBtn.disabled = true;
  addUser(q);
  await LOADING;

  // 1) 정규화: 오타 + 동의어 + 환자표현 + 외래어 + 부정 + 복수부위 + 시간 (Sprint 7~8)
  const norm = normalizeQuery(q);
  // 2) Red Flag 감지
  const redFlag = detectRedFlag(norm.normalized);
  // 3) 약물 상호작용 감지
  const drugHit = detectDrugInteraction(norm.normalized);
  // 4) 의도 분류
  const intents = classifyIntent(norm.normalized);
  // 4b) Sprint 8 W7 — 약물 비교 감지
  const drugCompare = detectDrugComparison(norm.normalized);
  // 4c) Sprint 8 W8 — 운동 금기 감지
  const exerciseContraindication = detectExerciseContraindication(norm.normalized, intents);
  // 4d) Sprint 13 W4 — 인구학 맥락 감지 (위험인자 정보 카드)
  const demographic = detectDemographicContext(norm.normalized);
  // 4e) Sprint 14 — 운동 카탈로그 감지 (운동명별 부위·금기 + 운동 일반)
  const exerciseCatalog = detectExerciseCatalog(norm.normalized);

  // 5) 확장 쿼리로 검색 (원본 + 확장 토큰 모두 + 시간 단계)
  const enrichedQuery = norm.normalized + ' ' + norm.expansions.join(' ');
  const qTokens = tokenize(enrichedQuery);
  const negatedCats = (norm.negated || []).map(n => n.category);
  // Sprint 13 — Red Flag 트리거 또는 응급 키워드 감지 시 응급 청크 부스트
  const redFlagActive = !!redFlag || detectEmergency(qTokens, enrichedQuery);
  const results = search(enrichedQuery, 5, negatedCats, norm.timeStage, norm.normalized, redFlagActive);

  // 6) 의도별 결과 분류
  const byIntent = classifyResults(results, intents);

  addBot({
    query: q,
    normalized: norm.normalized,
    typos: norm.typos,
    expansions: norm.expansions,
    negated: norm.negated,
    compoundParts: norm.compoundParts,
    patientPhrases: norm.patientPhrases,
    loanwords: norm.loanwords,
    timeStage: norm.timeStage,
    drugCompare,
    exerciseContraindication,
    demographic,
    exerciseCatalog,
    redFlag,
    drugHit,
    intents,
    results,
    byIntent,
    qTokens,
  });
  sendBtn.disabled = false;
  qInput.focus();
}

// ─── 결과를 의도 카드로 분류 ────────────────────────────────────
function classifyResults(results, intents) {
  const buckets = { diagnosis: [], emergency: [], drug: [], exercise: [], surgery: [], etc: [] };
  for (const r of results) {
    const h = (r.chunk.heading || '').toLowerCase();
    if (/red\s*flag|자가\s*체크|응급|마미|kanavel/i.test(r.chunk.heading)) {
      buckets.emergency.push(r);
    } else if (/^(1\.|1\s|흔한|감별|증상)/i.test(r.chunk.heading)) {
      buckets.diagnosis.push(r);
    } else if (/약|otc|nsaid|상호작용|주사/i.test(h)) {
      buckets.drug.push(r);
    } else if (/단계|운동|스트레칭|재활|물리치료/i.test(r.chunk.heading)) {
      buckets.exercise.push(r);
    } else if (/^5\.|수술|치환|봉합|관절경|의뢰/i.test(r.chunk.heading)) {
      buckets.surgery.push(r);
    } else {
      buckets.etc.push(r);
    }
  }
  return buckets;
}
